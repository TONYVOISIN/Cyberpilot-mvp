<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPilot MVP</title><style>
:root{--nav:#07111f;--cyan:#16c7d9;--bg:#f4f7fb;--text:#122033;--muted:#64748b;--border:#dbe4ee;--red:#e11d48;--orange:#ea580c;--yellow:#ca8a04;--green:#059669}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:250px;background:var(--nav);color:#fff;padding:22px;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.logo{width:44px;height:44px;border-radius:14px;background:var(--cyan);display:grid;place-items:center;color:var(--nav);font-size:24px}.brand b{font-size:19px}.brand small{display:block;color:#94a3b8;margin-top:2px}.nav button{width:100%;border:0;background:transparent;color:#a7b3c4;padding:12px;border-radius:11px;text-align:left;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--cyan);color:var(--nav);font-weight:700}.store{position:absolute;bottom:18px;left:18px;right:18px;padding:14px;border:1px solid #26364b;border-radius:14px;background:#0e1b2d;color:#b9c5d4;font-size:13px}.main{margin-left:250px;width:calc(100% - 250px)}header{height:78px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 30px;position:sticky;top:0;z-index:5}header small{color:#078b9a;font-weight:800;text-transform:uppercase}header h1{margin:3px 0 0}.pill{padding:7px 11px;border-radius:99px;background:#d1fae5;color:#047857;font-size:12px;font-weight:700}.content{padding:26px;max-width:1450px;margin:auto}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,1fr)}.metric,.card{background:#fff;border:1px solid var(--border);border-radius:17px;padding:20px;box-shadow:0 3px 12px #0f172a09}.metric span{color:var(--muted);font-size:13px}.metric strong{display:block;font-size:31px;margin-top:8px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff}.search{flex:1}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--nav);color:#fff;cursor:pointer;font-weight:700}.btn.alt{background:#fff;color:var(--text);border:1px solid var(--border)}.btn.danger{color:#be123c;background:#fff;border:1px solid #fecdd3}.cards{grid-template-columns:repeat(3,1fr)}.item h3{margin:12px 0 5px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.tag{display:inline-block;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}.critique{background:#ffe4e6;color:var(--red)}.elevee{background:#ffedd5;color:var(--orange)}.moyenne{background:#fef9c3;color:var(--yellow)}.faible{background:#e0f2fe;color:#0369a1}.ok{background:#d1fae5;color:var(--green)}.blocked{background:#ffe4e6;color:var(--red)}.actions{display:flex;gap:8px;margin-top:18px}.progress{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:13px}.progress i{display:block;height:100%;background:var(--cyan)}.hero{background:var(--nav);color:#fff;border-radius:18px;padding:23px;margin-bottom:17px}.hero p{color:#b9c5d4}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:14px}.modal{display:none;position:fixed;inset:0;background:#07111faa;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modalbox h2{margin-top:0}.form{display:grid;gap:11px}.form.two{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:1000px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}.metrics,.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{position:static;width:100%;height:auto}.app{display:block}.store{position:static;margin-top:20px}.main{margin:0;width:100%}.metrics,.cards{grid-template-columns:1fr}header{padding:0 16px}.content{padding:16px}.toolbar{flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">◈</div><div><b>CyberPilot</b><small>Identifier. Corriger. Anticiper.</small></div></div><div class="nav" id="nav"></div><div class="store">● Stockage local actif<br><small>Sauvegarde automatique dans ce navigateur.</small><div class="actions"><button class="btn alt" onclick="resetData()">Réinitialiser</button></div></div></aside><main class="main"><header><div><small>CyberPulse Solutions</small><h1 id="title">Vue générale</h1></div><span class="pill">Environnement local</span></header><div class="content" id="content"></div></main></div><div class="modal" id="modal"><div class="modalbox"><div class="row between"><h2 id="modalTitle">Ajouter</h2><button class="btn alt" onclick="closeModal()">Fermer</button></div><div id="modalBody"></div></div></div><script>
const KEY='cyberpilot-standalone-v1';const seed={clients:[{id:'CLI-001',name:'TransLog Démo',sector:'Transport',contact:'Sophie Martin',email:'sophie@demo.fr',status:'Actif'},{id:'CLI-002',name:'Alpina Industrie',sector:'Industrie',contact:'Marc Bernard',email:'marc@demo.fr',status:'Prospect'}],assets:[{id:'AST-001',clientId:'CLI-001',name:'Portail administration',type:'Application Web',criticality:'Critique',owner:'Équipe IT',status:'Supervisé'},{id:'AST-002',clientId:'CLI-001',name:'Environnement cloud',type:'Cloud',criticality:'Élevée',owner:'Infrastructure',status:'Supervisé'}],audits:[{id:'AUD-001',clientId:'CLI-001',name:'Audit Web - Portail client',scope:'Préproduction',authorization:true,status:'En cours',progress:65,start:'2026-10-10',end:'2026-10-22'},{id:'AUD-002',clientId:'CLI-002',name:'Revue configuration cloud',scope:'Tenant de démonstration',authorization:false,status:'Cadrage',progress:25,start:'2026-10-20',end:'2026-10-29'}],findings:[{id:'VUL-024',auditId:'AUD-001',assetId:'AST-001',title:'Authentification multifacteur absente',severity:'Critique',score:9.3,owner:'Équipe IT',due:'2026-10-18',status:'Ouvert',impact:'Risque accès non autorisé à un compte privilégié.',recommendation:'Activer authentification multifacteur et vérifier son application.'},{id:'VUL-021',auditId:'AUD-001',assetId:'AST-002',title:'Composant logiciel non maintenu',severity:'Élevée',score:8.1,owner:'Développement',due:'2026-10-22',status:'En cours',impact:'Le composant ne bénéficie plus des correctifs de sécurité.',recommendation:'Planifier son remplacement et valider la version cible.'}]};
let db=load(),page='dashboard';const pages=[['dashboard','Vue générale'],['clients','Clients'],['assets','Actifs'],['audits','Audits autorisés'],['findings','Vulnérabilités'],['reports','Rapports & données']];function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function id(prefix,rows){return prefix+'-'+String(Math.max(0,...rows.map(x=>+x.id.split('-')[1]||0))+1).padStart(3,'0')}function tag(v){let c=String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return `<span class="tag ${c}">${esc(v)}</span>`}function nameOf(rows,x){return rows.find(r=>r.id===x)?.name||x||'Non défini'}
function nav(){document.getElementById('nav').innerHTML=pages.map(([p,l])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${l}</button>`).join('')}function go(p){page=p;document.getElementById('title').textContent=pages.find(x=>x[0]===p)[1];nav();render()}function metric(t,v){return `<div class="metric"><span>${t}</span><strong>${v}</strong></div>`}
function render(){const c=document.getElementById('content');if(page==='dashboard'){let open=db.findings.filter(x=>x.status!=='Corrigé');c.innerHTML=`<div class="grid metrics">${metric('Clients',db.clients.length)}${metric('Actifs',db.assets.length)}${metric('Risques ouverts',open.length)}${metric('Audits autorisés',db.audits.filter(x=>x.authorization).length)}</div><div class="hero" style="margin-top:18px"><h2>Pilotage cyber centralisé</h2><p>Les indicateurs sont recalculés depuis les données conservées localement.</p></div><div class="card"><h2>Priorités immédiates</h2>${open.sort((a,b)=>b.score-a.score).map(x=>`<div class="row" style="padding:13px 0;border-bottom:1px solid var(--border)">${tag(x.severity)}<div style="flex:1"><b>${esc(x.title)}</b><div class="muted">${esc(x.owner)} · échéance ${esc(x.due)}</div></div><b>${x.score}</b></div>`).join('')||'<div class="empty">Aucune priorité ouverte</div>'}</div>`}else if(page==='reports')renderReports();else renderCrud()}
const cfg={clients:{title:'Clients',prefix:'CLI',fields:[['name','Entreprise'],['sector','Secteur'],['contact','Contact'],['email','E-mail'],['status','Statut']]},assets:{title:'Actifs',prefix:'AST',fields:[['clientId','Client','client'],['name','Nom de actif'],['type','Type'],['criticality','Criticité','severity'],['owner','Responsable'],['status','Statut']]},audits:{title:'Audits',prefix:'AUD',fields:[['clientId','Client','client'],['name','Mission'],['scope','Périmètre autorisé'],['authorization','Autorisation écrite','check'],['status','Statut'],['progress','Progression','number'],['start','Début','date'],['end','Fin','date']]},findings:{title:'Vulnérabilités',prefix:'VUL',fields:[['auditId','Audit','audit'],['assetId','Actif','asset'],['title','Titre'],['severity','Criticité','severity'],['score','Score','number'],['owner','Responsable'],['due','Échéance','date'],['status','Statut'],['impact','Impact','area'],['recommendation','Recommandation','area']]}};
function searchRows(rows,q){q=q.toLowerCase();return rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}function renderCrud(){let rows=db[page],q='';document.getElementById('content').innerHTML=`<div class="toolbar"><input class="input search" id="search" placeholder="Rechercher"><button class="btn" onclick="openForm()">+ Ajouter</button></div><div class="muted" id="count"></div><div class="grid cards" id="list"></div>`;let input=document.getElementById('search');input.oninput=()=>draw(searchRows(rows,input.value));draw(rows)}function draw(rows){document.getElementById('count').textContent=rows.length+' élément(s)';document.getElementById('list').innerHTML=rows.map(card).join('')||'<div class="empty">Aucune donnée</div>'}function card(x){let body='';if(page==='clients')body=`${tag(x.status)}<h3>${esc(x.name)}</h3><div class="muted">${esc(x.sector)}</div><p>${esc(x.contact)}<br>${esc(x.email)}</p>`;if(page==='assets')body=`${tag(x.criticality)}<h3>${esc(x.name)}</h3><div class="muted">${esc(x.type)} · ${esc(nameOf(db.clients,x.clientId))}</div><p>Responsable : ${esc(x.owner)}</p>`;if(page==='audits')body=`${tag(x.authorization?'OK':'Bloqué')}<h3>${esc(x.name)}</h3><div class="muted">${esc(nameOf(db.clients,x.clientId))} · ${esc(x.scope)}</div><div class="progress"><i style="width:${Math.min(100,x.progress||0)}%"></i></div><p class="muted">${esc(x.status)} · ${x.progress||0}%</p>`;if(page==='findings')body=`<div class="row between"><div>${tag(x.severity)} ${tag(x.status)}</div><b>${x.score}</b></div><h3>${esc(x.title)}</h3><div class="muted">${esc(nameOf(db.assets,x.assetId))} · ${esc(x.owner)}</div><p>${esc(x.impact)}</p>`;return `<div class="card item"><div class="muted">${x.id}</div>${body}<div class="actions"><button class="btn alt" onclick="openForm('${x.id}')">Modifier</button><button class="btn danger" onclick="removeRow('${x.id}')">Supprimer</button></div></div>`}
function fieldHtml([k,l,t],v){v=v??'';if(t==='client')return `<label>${l}<select name="${k}">${db.clients.map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;if(t==='asset')return `<label>${l}<select name="${k}">${db.assets.map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;if(t==='audit')return `<label>${l}<select name="${k}">${db.audits.map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;if(t==='severity')return `<label>${l}<select name="${k}">${['Critique','Élevée','Moyenne','Faible'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></label>`;if(t==='check')return `<label class="row"><input style="width:auto" type="checkbox" name="${k}" ${v?'checked':''}> ${l}</label>`;if(t==='area')return `<label class="full">${l}<textarea name="${k}" rows="3">${esc(v)}</textarea></label>`;return `<label>${l}<input class="input" type="${t||'text'}" name="${k}" value="${esc(v)}"></label>`}
function openForm(rowId=''){let row=db[page].find(x=>x.id===rowId)||{};document.getElementById('modalTitle').textContent=(rowId?'Modifier ':'Ajouter ')+cfg[page].title;document.getElementById('modalBody').innerHTML=`<form class="form two" id="form">${cfg[page].fields.map(f=>fieldHtml(f,row[f[0]])).join('')}<input type="hidden" name="id" value="${rowId}"><button class="btn full">Enregistrer</button></form>`;document.getElementById('form').onsubmit=submitForm;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function submitForm(e){e.preventDefault();let fd=new FormData(e.target),obj={};cfg[page].fields.forEach(([k,l,t])=>obj[k]=t==='check'?e.target.elements[k].checked:t==='number'?Number(fd.get(k)):fd.get(k));let oldId=fd.get('id');obj.id=oldId||id(cfg[page].prefix,db[page]);db[page]=oldId?db[page].map(x=>x.id===oldId?obj:x):[...db[page],obj];save();closeModal();render()}function removeRow(rowId){if(!confirm('Supprimer cet élément ?'))return;db[page]=db[page].filter(x=>x.id!==rowId);save();render()}
function renderReports(){let fixed=db.findings.filter(x=>x.status==='Corrigé').length;document.getElementById('content').innerHTML=`<div class="hero"><h2>Rapports et portabilité</h2><p>Exportez une sauvegarde complète ou réimportez un fichier CyberPilot.</p><div class="actions"><button class="btn" onclick="exportData()">Exporter JSON</button><label class="btn alt">Importer JSON<input type="file" accept="application/json" hidden onchange="importData(this)"></label></div></div><div class="grid metrics">${metric('Vulnérabilités',db.findings.length)}${metric('Corrections vérifiées',fixed)}${metric('Missions actives',db.audits.filter(x=>x.status!=='Clôturé').length)}${metric('Clients actifs',db.clients.filter(x=>x.status==='Actif').length)}</div><div class="card" style="margin-top:18px"><h2>Synthèse dirigeant</h2><p>Le portefeuille contient <b>${db.clients.length} client(s)</b>, <b>${db.assets.length} actif(s)</b> et <b>${db.findings.length} constat(s)</b>.</p><p><b>${db.findings.filter(x=>x.severity==='Critique'&&x.status!=='Corrigé').length}</b> vulnérabilité(s) critique(s) restent ouvertes.</p></div>`}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='CyberPilot_Sauvegarde.json';a.click();URL.revokeObjectURL(u)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.clients||!x.assets||!x.audits||!x.findings)throw 0;db=x;save();render();alert('Import réussi')}catch{alert('Fichier invalide')}};r.readAsText(f)}function resetData(){if(confirm('Réinitialiser toutes les données de démonstration ?')){db=structuredClone(seed);save();render()}}nav();render();
</script></body></html>
